# Fake token fixtures in tests (e.g. glpat-echoed-secret-000 in
# src/worktree.test.ts) trip the generic-api-key rule. A real GitLab PAT is
# 20 random characters; these fixtures are lowercase words with an all-zero
# suffix, so this pattern cannot match a real token. The WebSocket upgrade test
# sends the published RFC 6455 sample key ("the sample nonce" in base64).
# Commit 45d34b8 (src/tokens.ts) held omp's public Anthropic OAuth client id.
# A public OAuth client id is no secret: omp ships it in its own source.
#
# CI checks out with fetch-depth: 0, so the gitleaks history walk covers every
# branch, not just main. The impeccable design loop injects a live-reload
# marker (`<script src="http://localhost:8400/live.js?token=<uuid>">`) into
# src/ui/index.html; commit 7046295 on ui/lineage-rail committed it, and that
# uuid fails main's Scan on every push. The marker only ever talks to the
# developer's own localhost server, so the file is allowlisted, not the uuid
# (a real uuid-shaped secret elsewhere stays flagged).
[extend]
useDefault = true

# gitleaks ORs the conditions inside one allowlist block, so scoping rides on
# paths alone; [allowlist] (singular) is deprecated next to [[allowlists]].
[[allowlists]]
description = "fake token fixtures, the RFC 6455 sample key, and a public OAuth client id"
regexes = ['''\bglpat-[a-z-]+-0{3,}\b''', '''dGhlIHNhbXBsZSBub25jZQ==''', '''9d1c250a-e61b-44d9-88ed-594fedd48592''']

[[allowlists]]
description = "impeccable live-reload dev marker injected into the UI entry html"
paths = ['''(^|/)src/ui/index\.html$''']

# Commit 9fc23a9 added two PEM header strings to the settings test; the
# private-key rule pairs a BEGIN header with a KEY----- tail 64+ characters
# later, so the two strings matched as one leak and failed the Scan job on
# every push. The settings tip commit replaces both with the fake-key-0000
# fixture, but the finding lives in that commit's patch, which history keeps
# forever. Scoped to the one commit: a future PEM string anywhere else stays
# flagged.

[[allowlists]]
description = "the settings test PEM fixture pairing in commit 9fc23a9, replaced by fake-key-0000 on the tip"
commits = ["9fc23a988c46bc57a9a8b93cd15155bdbb672c87"]

# Commit 985b7c6 added fake GitHub tokens to the pushAuthKind test in
# src/gitHosts.test.ts. The 20-character values hold 20 distinct characters,
# so generic-api-key's entropy bar of 3.7 flags them. The tip commit moves
# them to the zero-suffix fixture style, but the finding lives in that
# commit's patch, which history keeps forever. Scoped to the one commit: a
# real token never looks like `ghp_aaaa0000aaaa0000`, and a secret-shaped
# string anywhere else stays flagged.

[[allowlists]]
description = "fake GitHub token fixtures in commit 985b7c6, replaced by the zero-suffix style on the tip"
commits = ["985b7c6ea775d4f8f923b8d5dcf13d906f4b7026"]

# Commit 1b168b3 added fake GitHub tokens to the githubAuthHint test in
# src/githubAuthHint.test.ts. The 13- and 15-character values hold all
# distinct characters, so generic-api-key's entropy bar of 3.7 flags them.
# The tip commit moves them to the zero-suffix fixture style, but the
# finding lives in that commit's patch, which history keeps forever.
# Scoped to the one commit: a real token never looks like
# `ghs_aaaa0000aaaa0000`, and a secret-shaped string anywhere else stays
