<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-labelledby="t" class="wf">
  <title id="t">Ottr review workflow: a read-only review card runs the full verification and a security audit, ranks its findings, files the confirmed ones as task cards, and is done only when they are all done.</title>
  <defs>
    <style>
      .wf text{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif}
      .wf .n{fill:#eceef1;font-size:14px;font-weight:600}
      .wf .n13{fill:#eceef1;font-size:13.5px;font-weight:600}
      .wf .s{fill:#a8b0b9;font-size:12px}
      .wf .m{fill:#c9ced4;font-size:12px;font-family:'Cascadia Code',ui-monospace,Menlo,Consolas,monospace}
      .wf .lg{fill:#a8b0b9;font-size:12px}
      .wf .bt{fill:#14181d;font-size:12.5px;font-weight:600}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fb0d0"/></marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f0b429"/></marker>
    <g id="g-ring"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#8f979f" stroke-width="1.8"/></g>
    <g id="g-dot"><circle cx="8" cy="8" r="4.5" fill="#8f979f"/></g>
    <g id="g-check"><path d="M3 8.5L6.8 12L13 4.5" fill="none" stroke="#8f979f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="g-warn"><path d="M8 1.5L15 14H1z" fill="#f0b429"/><rect x="7.1" y="5.4" width="1.8" height="4.8" rx="0.9" fill="#14181d"/><circle cx="8" cy="12.1" r="1.1" fill="#14181d"/></g>
  </defs>

  <rect x="0.5" y="0.5" width="1119" height="339" rx="6" fill="#2b2e32" stroke="#3d4248"/>

  <!-- entry -->
  <rect x="24" y="115" width="76" height="30" rx="4" fill="#8fb0d0"/>
  <text x="62" y="134.5" text-anchor="middle" class="bt">Review</text>
  <line x1="102" y1="130" x2="128" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- spine -->
  <rect id="wf-st-todo" x="132" y="88" width="176" height="84" rx="6" fill="#3a3f45" stroke="#4a5057"/>
  <use href="#g-dot" transform="translate(144,110) scale(0.875)"/>
  <text x="166" y="117" class="n">Review card</text>
  <text x="146" y="136" class="s">changes no code</text>
  <text x="146" y="151" class="s">own worktree · session</text>
  <text x="146" y="166" class="s">one review at a time</text>

  <line x1="310" y1="130" x2="326" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect id="wf-st-in_progress" x="330" y="88" width="208" height="84" rx="6" fill="#3a3f45" stroke="#4a5057"/>
  <text x="344" y="117" class="n">Verification</text>
  <text x="344" y="137" class="m">bun run check · bun test</text>
  <text x="344" y="153" class="m">mutation tests — Stryker</text>
  <text x="344" y="168" class="s">full security audit</text>

  <line x1="540" y1="130" x2="552" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="556" y="88" width="216" height="84" rx="6" fill="#3a3f45" stroke="#4a5057"/>
  <text x="570" y="117" class="n">Findings</text>
  <text x="570" y="137" class="s">ranked — blockers must quote</text>
  <text x="570" y="152" class="s">top 10 + high/crit → 2nd model</text>
  <text x="570" y="167" class="s">pass → cards · rest → notes</text>

  <line x1="774" y1="130" x2="788" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect id="wf-st-merging" x="792" y="88" width="180" height="84" rx="6" fill="#3a3f45" stroke="#4a5057"/>
  <text x="806" y="117" class="n">Findings merge</text>
  <text x="806" y="137" class="s">only these cards merge</text>
  <text x="806" y="152" class="s">others wait in Merging</text>
  <text x="806" y="167" class="s">card done when they are</text>

  <line x1="974" y1="130" x2="988" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- terminal -->
  <rect id="wf-st-done" x="992" y="115" width="96" height="30" rx="4" fill="#1f2225" stroke="#3d4248"/>
  <use href="#g-check" transform="translate(1002,122) scale(0.75)"/>
  <text x="1020" y="134.5" class="n" font-size="12.5">Approved</text>

  <!-- findings become task cards -->
  <line x1="664" y1="174" x2="664" y2="228" stroke="#8fb0d0" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="672" y="205" class="s">filed</text>
  <rect x="556" y="232" width="216" height="56" rx="4" fill="#1f2225" stroke="#3d4248"/>
  <text x="570" y="254" class="n13">filed as task cards</text>
  <text x="570" y="271" class="s">they run the task workflow</text>

  <!-- blockers -->
  <line x1="882" y1="174" x2="882" y2="228" stroke="#f0b429" stroke-width="1.2" marker-end="url(#aa)"/>
  <text x="890" y="205" class="s">blockers</text>
  <rect x="792" y="232" width="180" height="56" rx="6" fill="#3a3f45" stroke="#f0b429" stroke-width="1.2"/>
  <use href="#g-warn" transform="translate(804,242) scale(0.875)"/>
  <text x="828" y="256" class="n13">Asks with blockers</text>
  <text x="806" y="273" class="s">reply, and it continues</text>
  <polyline points="842,232 842,214 710,214 710,174" fill="none" stroke="#f0b429" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#aa)"/>

  <!-- legend -->
  <use href="#g-ring" transform="translate(24,310) scale(0.75)"/>
  <text x="42" y="322" class="lg">queued</text>
  <use href="#g-dot" transform="translate(100,310) scale(0.75)"/>
  <text x="118" y="322" class="lg">running</text>
  <use href="#g-check" transform="translate(182,310) scale(0.75)"/>
  <text x="200" y="322" class="lg">done</text>
  <use href="#g-warn" transform="translate(250,310) scale(0.75)"/>
  <text x="268" y="322" class="lg">needs you</text>
  <line x1="344" y1="316" x2="362" y2="316" stroke="#4a5057" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="368" y="322" class="lg">optional</text>
</svg>
