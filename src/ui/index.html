<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#24272b" />
    <title>Ottr</title>
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./app.css" />
    <script>
      // Resolve the saved theme before first paint so light users never see a dark flash.
      const t = localStorage.getItem("ottr.theme") ?? "system";
      if (t === "light" || (t !== "dark" && matchMedia("(prefers-color-scheme: light)").matches))
        document.documentElement.dataset.theme = "light";
    </script>
    <script>
      // Design-work switch: with ?pin-popovers in the URL, light-dismiss popovers become manual
      // ones, so a click elsewhere (the impeccable live picker) leaves them open. Their own
      // buttons still close them. Open ones are remembered for the tab session, so a dev-server
      // reload opens them again. Without the parameter, nothing changes.
      if (new URLSearchParams(location.search).has("pin-popovers")) {
        const key = "ottr.pinned-popovers";
        const open = new Set(JSON.parse(sessionStorage.getItem(key) ?? "[]"));
        // beforetoggle fires in sync, before the observer can reopen a popover that is closing;
        // it does not bubble, but the capture phase still passes the document.
        document.addEventListener("beforetoggle", (e) => {
          if (!e.target.id || e.target.popover === null) return;
          if (e.newState === "open") open.add(e.target.id);
          else open.delete(e.target.id);
          sessionStorage.setItem(key, JSON.stringify([...open]));
        }, true);
        new MutationObserver(() => {
          for (const p of document.querySelectorAll('[popover="auto"]')) p.popover = "manual";
          for (const id of open) {
            const p = document.getElementById(id);
            if (p?.popover && !p.matches(":popover-open")) p.showPopover();
          }
        }).observe(document.documentElement, { subtree: true, childList: true, attributeFilter: ["popover"] });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Paints before the bundle loads and React mounts; React replaces the content on mount.
           Same bones as the board's initial Skeleton (kit.tsx: list, 6 rows, same label), so the
           wait looks identical and the screen is never blank on a slow load. -->
      <div class="skeleton" data-shape="list" role="status" aria-label="Loading the board">
        <span class="skeleton-bone" aria-hidden="true"></span>
        <span class="skeleton-bone" aria-hidden="true"></span>
        <span class="skeleton-bone" aria-hidden="true"></span>
        <span class="skeleton-bone" aria-hidden="true"></span>
        <span class="skeleton-bone" aria-hidden="true"></span>
        <span class="skeleton-bone" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="./app.tsx"></script>
  </body>
</html>
