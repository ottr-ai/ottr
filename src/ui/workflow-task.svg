<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-labelledby="t" class="wf">
  <title id="t">Ottr task workflow: a card runs from Todo through In progress and Merging to Done. A needs-you reply continues the same session, an answered report never merges, and the optional retro pass follows Done.</title>
  <defs>
    <style>
      .wf text{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif}
      .wf .n{fill:#eceef1;font-size:14px;font-weight:600}
      .wf .n13{fill:#eceef1;font-size:13.5px;font-weight:600}
      .wf .s{fill:#a8b0b9;font-size:12px}
      .wf .m{fill:#c9ced4;font-size:12px;font-family:'Cascadia Code',ui-monospace,Menlo,Consolas,monospace}
      .wf .lg{fill:#a8b0b9;font-size:12px}
      .wf .bt{fill:#14181d;font-size:12.5px;font-weight:600}
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8fb0d0"/></marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#f0b429"/></marker>
    <g id="g-ring"><circle cx="8" cy="8" r="5.5" fill="none" stroke="#8f979f" stroke-width="1.8"/></g>
    <g id="g-dot"><circle cx="8" cy="8" r="4.5" fill="#8f979f"/></g>
    <g id="g-check"><path d="M3 8.5L6.8 12L13 4.5" fill="none" stroke="#8f979f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="g-warn"><path d="M8 1.5L15 14H1z" fill="#f0b429"/><rect x="7.1" y="5.4" width="1.8" height="4.8" rx="0.9" fill="#14181d"/><circle cx="8" cy="12.1" r="1.1" fill="#14181d"/></g>
  </defs>

  <rect x="0.5" y="0.5" width="1119" height="339" rx="6" fill="#2b2e32" stroke="#3d4248"/>

  <!-- entry -->
  <rect x="24" y="115" width="84" height="30" rx="4" fill="#8fb0d0"/>
  <text x="66" y="134.5" text-anchor="middle" class="bt">New task</text>
  <line x1="110" y1="130" x2="128" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- spine -->
  <rect id="wf-st-todo" x="132" y="88" width="168" height="84" rx="6" fill="#3a3f45" stroke="#4a5057"/>
  <use href="#g-ring" transform="translate(144,110) scale(0.875)"/>
  <text x="166" y="118" class="n">Todo</text>
  <text x="146" y="136" class="s">waits for a free slot</text>
  <text x="146" y="152" class="s">2 / project · 3 total</text>

  <line x1="294" y1="130" x2="328" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect id="wf-st-in_progress" x="332" y="88" width="208" height="84" rx="6" fill="#3a3f45" stroke="#4a5057"/>
  <use href="#g-dot" transform="translate(344,110) scale(0.875)"/>
  <text x="366" y="117" class="n">In progress</text>
  <text x="346" y="136" class="s">work turn — own session</text>
  <text x="346" y="152" class="m">.worktrees/&lt;id&gt;</text>
  <text x="346" y="167" class="m">ott/&lt;id&gt;-&lt;slug&gt;</text>

  <line x1="542" y1="130" x2="668" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect id="wf-st-merging" x="672" y="88" width="220" height="84" rx="6" fill="#3a3f45" stroke="#4a5057"/>
  <use href="#g-dot" transform="translate(684,110) scale(0.875)"/>
  <text x="706" y="117" class="n">Merging</text>
  <text x="686" y="136" class="s">merge turn — one per project</text>
  <text x="686" y="152" class="s">rebase · checks · merge · push</text>
  <text x="686" y="167" class="s">ready: ahead + clean tree</text>

  <line x1="894" y1="130" x2="924" y2="130" stroke="#8fb0d0" stroke-width="1.5" marker-end="url(#a)"/>

  <rect id="wf-st-done" x="928" y="88" width="140" height="84" rx="6" fill="#3a3f45" stroke="#4a5057"/>
  <use href="#g-check" transform="translate(940,110) scale(0.875)"/>
  <text x="964" y="117" class="n">Done</text>
  <text x="942" y="137" class="s">worktree removed</text>
  <text x="942" y="152" class="s">branch removed</text>

  <!-- work check, optional, above the spine -->
  <rect x="460" y="14" width="200" height="52" rx="6" fill="#303338" stroke="#4a5057" stroke-dasharray="4 3"/>
  <text x="474" y="33" class="n13">Work check</text>
  <text x="474" y="50" class="s">second model — optional</text>
  <line x1="560" y1="66" x2="560" y2="127" stroke="#8fb0d0" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="560" cy="130" r="2.5" fill="#8fb0d0"/>
  <polyline points="460,40 440,40 440,86" fill="none" stroke="#8fb0d0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="436" y="36" text-anchor="end" class="s">blockers go back — at most twice</text>

  <!-- needs-you branch -->
  <circle cx="636" cy="130" r="2.5" fill="#8fb0d0"/>
  <line x1="636" y1="133" x2="636" y2="228" stroke="#8fb0d0" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="556" y="232" width="160" height="56" rx="6" fill="#3a3f45" stroke="#f0b429" stroke-width="1.2"/>
  <use href="#g-warn" transform="translate(568,244) scale(0.875)"/>
  <text x="590" y="258" class="n13">Needs you</text>
  <text x="570" y="274" class="s">reply → same session</text>
  <polyline points="580,232 580,214 436,214 436,174" fill="none" stroke="#8fb0d0" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- answered branch -->
  <line x1="368" y1="174" x2="368" y2="228" stroke="#8fb0d0" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="376" y="205" class="s">answered</text>
  <rect x="332" y="232" width="200" height="64" rx="4" fill="#1f2225" stroke="#3d4248"/>
  <text x="346" y="254" class="n13">Answered</text>
  <text x="346" y="270" class="s">no commits — questions</text>
  <text x="346" y="285" class="s">research: report · no merge</text>

  <!-- retro -->
  <line x1="998" y1="174" x2="998" y2="228" stroke="#8fb0d0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <rect x="918" y="232" width="168" height="64" rx="6" fill="#303338" stroke="#4a5057" stroke-dasharray="4 3"/>
  <text x="932" y="254" class="n13">Retro</text>
  <text x="932" y="270" class="s">a Setting, after Done</text>
  <text x="932" y="285" class="s">3 lessons · 1 proposal</text>

  <!-- legend -->
  <use href="#g-ring" transform="translate(24,310) scale(0.75)"/>
  <text x="42" y="322" class="lg">queued</text>
  <use href="#g-dot" transform="translate(100,310) scale(0.75)"/>
  <text x="118" y="322" class="lg">running</text>
  <use href="#g-check" transform="translate(182,310) scale(0.75)"/>
  <text x="200" y="322" class="lg">done</text>
  <use href="#g-warn" transform="translate(250,310) scale(0.75)"/>
  <text x="268" y="322" class="lg">needs you</text>
  <line x1="344" y1="316" x2="362" y2="316" stroke="#4a5057" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="368" y="322" class="lg">optional</text>
</svg>
