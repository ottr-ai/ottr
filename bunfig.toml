[install]
# G21: a release must be at least 7 days old before Bun resolves it.
minimumReleaseAge = 604800

[test]
# The full suite runs many second-long integration tests (app mounts, git
# fixtures, seeded stores); on a loaded machine several sit within ~100 ms of
# Bun's 5000 ms default, and small load changes flip them (observed: different
# tests capped per run in src/hosted.git.test.ts and src/turn.test.ts). The
# ceiling stays an order of magnitude below the suite's own slow-seed tests,
# which set 20 s explicitly, so a genuinely hung test still fails fast.
timeout = 20000
# OTTR-1162: the suite must never write the board's own repository. The preload routes every
# git exec through a shim that refuses writes resolving into the enclosing repo (see
# src/test/boardRepoGuard.ts). Active only under bun test.
# OTTR-1180: suiteEnv.ts must stay second — its env snapshot has to keep the guard's shim
# PATH, or the restore below would silently disarm the guard (the guard's own wiring test
# fails loud if the order ever flips).
preload = [
	"./src/test/boardRepoGuard.ts",
	"./src/test/suiteEnv.ts",
	# OTTR-1209: the temp-hygiene guard must load after the env snapshot (suiteEnv) and before
	# any test file: it baselines tmpdir() and its afterAll fails the run on new fixture dirs.
	"./src/test/tempHygiene.ts",
]
