[install]
# G21: a release must be at least 7 days old before Bun resolves it.
minimumReleaseAge = 604800

[test]
# No bunfig key sets the bun test per-test timeout. Bun 1.4.5 ignores [test] timeout,
# [test] testTimeout, [test] defaultTimeout, and a top-level timeout (each ran into
# the 5000 ms default with a 6 s test; the bunfig parser reads no timeout key,
# oven-sh/bun#7789, oven-sh/bun#38728). The gate commands carry the 20 s ceiling
# instead (`bun test --timeout=20000`; see AGENTS.md, CONTRIBUTING.md,
# docs/development.md, .github/workflows/ci.yml). The ceiling stays an order of
# magnitude below the suite's own slow-seed tests, which set 20 s explicitly, so a
# genuinely hung test still fails fast.
# OTTR-1162: the suite must never write the board's own repository. The preload routes every
# git exec through a shim that refuses writes resolving into the enclosing repo (see
# src/test/boardRepoGuard.ts). Active only under bun test.
# OTTR-1180: suiteEnv.ts must stay second — its env snapshot has to keep the guard's shim
# PATH, or the restore below would silently disarm the guard (the guard's own wiring test
# fails loud if the order ever flips).
preload = [
	# OTTR-1209: the temp-hygiene guard loads FIRST, before any other preload creates temp
	# state: boardRepoGuard's git-shim dir then lands inside the per-process run root and is
	# removed with it at the run's end, instead of leaking one ottr-board-guard-* dir into
	# the OS temp dir per bun test run.
	"./src/test/tempHygiene.ts",
	"./src/test/boardRepoGuard.ts",
	# OTTR-1180: suiteEnv must load after boardRepoGuard: its per-test env snapshot has to
	# keep the guard's shim PATH, or the restore would silently disarm the guard (the guard's
	# own wiring test fails loud if the order ever flips).
	"./src/test/suiteEnv.ts",
]
