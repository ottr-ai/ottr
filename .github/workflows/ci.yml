name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # Keep in step with Dockerfile.worker.
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run check
      # bun's 5s default fires at await boundaries; loaded windows runners stalled one
      # test to 7.3s (run 37528369810). 20s covers the legit 8.7s tail, still fails hangs.
      - run: bun test --timeout 20000
      - run: bun run test:e2e

  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks walks the whole history
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan the git history for secrets
        # The config comes from origin/main, not the scanned tree: a PR must
        # not be able to weaken its own secret-scan ruleset.
        run: |
          git show origin/main:.gitleaks.toml > "$RUNNER_TEMP/gitleaks.toml"
          ./gitleaks git . --config "$RUNNER_TEMP/gitleaks.toml" --redact --exit-code 1 --no-banner
      - name: Install zizmor 1.30.1
        env:
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          curl -fsSLo zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "$ZIZMOR_SHA256  zizmor.tar.gz" | sha256sum -c -
          tar xzf zizmor.tar.gz zizmor
      - name: Audit the GitHub config offline
        run: ./zizmor --no-online-audits .github --collect workflows --collect actions --collect dependabot
