name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: docker.io/library/postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          # Isolated runner service only; never use trust for production.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --tmpfs /var/lib/postgresql
    env:
      OTTR_TEST_PG_URL: postgres://postgres@127.0.0.1:${{ job.services.postgres-test.ports[5432] }}/postgres
      OTTR_REQUIRE_PG_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # a PR build needs origin/main for the trigger; a push build diffs empty and the script no-ops without network
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # Keep in step with Dockerfile.worker.
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level=high
      - run: bun run check
      # bun's 5s default fires at await boundaries; loaded windows runners stalled one
      # test to 7.3s (run 37528369810). 20s covers the legit 8.7s tail, still fails hangs.
      - run: bun test --timeout 20000
      - run: bun run test:e2e

  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks walks the whole history
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          # GitHub releases return transient 5xx (OTTR-653); retry instead of failing the
          # job. Exponential backoff capped at 300s total (OTTR-654): a 504 episode outlasted
          # the old fixed 5 x 2s budget.
          curl --retry 10 --retry-max-time 300 --retry-all-errors -fsSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan the git history for secrets
        # The config comes from origin/main, not the scanned tree: a PR must
        # not be able to weaken its own secret-scan ruleset.
        run: |
          git show origin/main:.gitleaks.toml > "$RUNNER_TEMP/gitleaks.toml"
          ./gitleaks git . --config "$RUNNER_TEMP/gitleaks.toml" --redact --exit-code 1 --no-banner
      - name: Install zizmor 1.30.1
        env:
          ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
        run: |
          curl --retry 10 --retry-max-time 300 --retry-all-errors -fsSLo zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "$ZIZMOR_SHA256  zizmor.tar.gz" | sha256sum -c -
          tar xzf zizmor.tar.gz zizmor
      - name: Audit the GitHub config offline
        run: ./zizmor --no-online-audits .github --collect workflows --collect actions --collect dependabot
