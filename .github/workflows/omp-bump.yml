name: omp bump check

# The Ottr server's omp watch (docs/specs/omp-watch.md) moves OMP_VERSION. It reviews the
# changelog of each omp release and files a "Bump omp to <version>" card. The merge turn of
# that card pushes the bump. This job does not move the pin and pushes nothing. It only
# proves that the pinned omp starts on the image's bun (docs/WORKERS.md, "Updates").
on:
  push:
    branches: [main]
    paths: [Dockerfile.worker]
  workflow_dispatch:

permissions: {} # nothing at the workflow level; the check job grants what it needs

concurrency:
  group: omp-bump

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The failure this catches: an omp that needs a newer bun than the image's base.
      - name: Start the pinned omp on the image's bun
        run: |
          version=$(sed -n 's/^ARG OMP_VERSION=//p' Dockerfile.worker)
          # The pin goes into a shell command: only a plain x.y.z version may.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Dockerfile.worker pins the unexpected omp version '$version'"; exit 1; }
          # The base of the `worker` stage; the later FROM lines name build stages, not images.
          base=$(sed -n 's/^FROM \([^ ]*\) AS worker$/\1/p' Dockerfile.worker)
          [ -n "$base" ] || { echo "::error::Dockerfile.worker names no worker stage base"; exit 1; }
          docker run --rm "$base" sh -c 'bun install -g "@oh-my-pi/pi-coding-agent@$1" && omp --version' _ "$version"
