name: Audit

# Weekly static and periodic audit: fresh advisories for the lockfile, Dockerfile checks,
# pinned Trivy runs over the worker image and the repo tree, a warn-only Opengrep SAST
# scan over src/, and an OWASP ZAP baseline scan over a throwaway board. Contents-read
# everywhere; no secrets; every downloaded binary and image is checksum- or digest-pinned.

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC, off the hour.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # Keep in step with Dockerfile.worker.
      - run: bun install --frozen-lockfile
      # Same lockfile, fresh advisory feed: finds new advisories in existing deps.
      - run: bun audit --audit-level=high

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Opengrep 1.33.1 (2026-10-29): the newest stable release (the v2.0.0-* entries are
      # pre-release alphas). SHA-256 of opengrep_manylinux_x86. The release publishes no
      # checksums file (none from v1.16.5 to v1.33.1 does, only per-binary sigstore
      # .cert/.sig), so this digest was taken from the release asset itself over HTTPS
      # when pinning.
      OPENGREP_SHA256: 46e8133cc490f9f50518061590ce2f6be5a08afaeda034471c0ceda4b3899808
      # Repo-authored rules instead of a registry pull: the Semgrep registry rules carry
      # the restrictive Semgrep Rules License, and Opengrep's own opengrep-rules fork is
      # LGPL-2.1 plus a Commons Clause (its maintainers call it research-only), so neither
      # is open enough to fetch. First triage (2026-11-06, 1.33.1): 16 findings over src/
      # (158 files) — 12 shell-command interpolations, 4 SQL interpolations. None is a
      # true positive: the 9 production hits (src/login.ts, src/store.ts) interpolate
      # locally defined constants (PRAGMA numbers, table/column names from literals), and
      # the other 7 sit in *.test.ts fixtures (ssh-keygen onto temp dirs, DDL strings).
      # Strict flip once the run stays this quiet: append --error to the scan so findings
      # exit 1. Today findings exit 0 and only a broken rules file or a crashed scan fails
      # the job; --exclude "*.test.*" would drop the fixture noise at the same time.
      OPENGREP_RULES: |
        rules:
          - id: ottr-eval-dynamic-argument
            message: "eval() on a non-literal expression executes arbitrary code; untrusted data here is code injection"
            severity: WARNING
            languages: [typescript, javascript]
            patterns:
              - pattern: eval($X)
              - pattern-not: eval("...")
              - pattern-not: eval('...')

          - id: ottr-new-function-dynamic
            message: "new Function() compiles a runtime-built string into executable code; untrusted data here is code injection"
            severity: WARNING
            languages: [typescript, javascript]
            patterns:
              - pattern: new Function($X)
              - metavariable-regex:
                  metavariable: $X
                  regex: "^[^\"'`]"

          - id: ottr-new-function-template-interpolation
            message: "new Function() on an interpolated template compiles runtime data into executable code"
            severity: WARNING
            languages: [typescript, javascript]
            pattern: "new Function(`...${$X}...`)"

          - id: ottr-shell-exec-template-interpolation
            message: "shell command built with string interpolation; untrusted data reaches the shell"
            severity: WARNING
            languages: [typescript, javascript]
            pattern-either:
              - pattern: "exec(`...${$X}...`)"
              - pattern: "execSync(`...${$X}...`)"
              - pattern: "$CP.exec(`...${$X}...`)"
              - pattern: "$CP.execSync(`...${$X}...`)"

          - id: ottr-hash-md5-sha1
            message: "MD5/SHA-1 are broken for security purposes; use SHA-256 or stronger"
            severity: WARNING
            languages: [typescript, javascript]
            pattern-either:
              - pattern: createHash("md5")
              - pattern: createHash("sha1")

          - id: ottr-tls-reject-unauthorized-false
            message: "rejectUnauthorized: false disables TLS certificate validation (man-in-the-middle risk)"
            severity: WARNING
            languages: [typescript, javascript]
            pattern: "rejectUnauthorized: false"

          - id: ottr-node-tls-env-disabled
            message: "NODE_TLS_REJECT_UNAUTHORIZED set in code disables TLS validation process-wide"
            severity: WARNING
            languages: [typescript, javascript]
            pattern: "process.env.NODE_TLS_REJECT_UNAUTHORIZED = $X"

          - id: ottr-jwt-none-algorithm
            message: "JWT algorithms list containing none accepts unsigned tokens"
            severity: WARNING
            languages: [typescript, javascript]
            pattern-either:
              - pattern: "algorithms: [\"none\", ...]"
              - pattern: "algorithms: [..., \"none\"]"

          - id: ottr-dynamic-require
            message: "require() of a runtime-built path hides the dependency graph from bundlers and audits"
            severity: INFO
            languages: [typescript, javascript]
            patterns:
              - pattern: require($X)
              - metavariable-regex:
                  metavariable: $X
                  regex: "^[^\"'`]"

          - id: ottr-require-template-interpolation
            message: "require() of an interpolated template path hides the dependency graph from bundlers and audits"
            severity: INFO
            languages: [typescript, javascript]
            pattern: "require(`...${$X}...`)"

          - id: ottr-dangerous-html
            message: "dangerouslySetInnerHTML renders raw HTML (XSS sink)"
            severity: INFO
            languages: [typescript, javascript]
            pattern: "dangerouslySetInnerHTML: $X"

          - id: ottr-sql-template-interpolation
            message: "SQL statement built with string interpolation; untrusted data reaches the query"
            severity: WARNING
            languages: [typescript, javascript]
            pattern-either:
              - pattern: "$DB.prepare(`...${$X}...`)"
              - pattern: "$DB.query(`...${$X}...`)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Opengrep (checksum-verified binary)
        run: |
          curl --retry 10 --retry-max-time 300 --retry-all-errors -fsSLo /tmp/opengrep \
            https://github.com/opengrep/opengrep/releases/download/v1.33.1/opengrep_manylinux_x86
          echo "$OPENGREP_SHA256  /tmp/opengrep" | sha256sum -c -
          chmod +x /tmp/opengrep
          /tmp/opengrep --version
      - name: SAST over src/ (warn-only)
        run: |
          printf '%s' "$OPENGREP_RULES" > "$RUNNER_TEMP/ottr-rules.yaml"
          /tmp/opengrep scan --config "$RUNNER_TEMP/ottr-rules.yaml" src/

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Trivy v0.75.0 (2026-10-01): the newest release published on/before 2026-10-07 that
      # GHSA-69fq-xp46-6x23 does not affect (it hits trivy = 0.69.4 only, the 2026-03
      # compromise that also force-pushed aquasecurity/trivy-action and setup-trivy tags;
      # both stay unused here). SHA-256 of trivy_0.75.0_Linux-64bit.tar.gz, cross-checked
      # against the release's trivy_0.75.0_checksums.txt when pinned.
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build runs the Dockerfile checks and lists violations as warnings, exit 0, on
      # purpose for the first runs; after the first triage add
      # --build-arg "BUILDKIT_DOCKERFILE_CHECK=error=true" so violations fail the job
      # (docs.docker.com/build/checks). Every ARG keeps its pinned default; nothing to pass.
      - run: docker build -t ottr-worker:audit -f Dockerfile.worker .
      - name: Install Trivy (checksum-verified tarball)
        run: |
          curl --retry 10 --retry-max-time 300 --retry-all-errors -fsSLo /tmp/trivy.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "$TRIVY_SHA256  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp
          /tmp/trivy --version
      - run: /tmp/trivy image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ottr-worker:audit
      # Weekly repo-tree scan with the binary installed above: secrets in the checkout
      # plus Dockerfile misconfiguration (CI's gitleaks and zizmor cover git history and
      # workflow files; src SAST is tracked separately). Warn-only for the first runs —
      # the known finding is DS-0002 (no USER directive in Dockerfile.worker, HIGH);
      # after triage add --exit-code 1 so HIGH/CRITICAL findings fail the job, like the
      # image scan above.
      - run: /tmp/trivy fs --scanners secret,misconfig --severity HIGH,CRITICAL .

  zap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: 4747
      # The wall compares the whole Host header, so the entry carries the :4747 form the
      # scan sends (src/requestGuards.ts hostMatches); the container maps the bare name.
      PUBLIC_HOST: zap-audit.local:4747
      # v2.17.0 (2025-12-15): the newest stable image published on/before 2026-10-07,
      # pinned by its registry digest; the tag 2.17.0 is named in the comment.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:7aaa659b0d43078febd82e29bad112285c370727e86ab8340444220e17d9f0d2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4 # Keep in step with Dockerfile.worker.
      - run: bun install --frozen-lockfile
      - name: Start the board (scratch state, as scripts/boot-smoke.ts does)
        run: |
          ROOTS="$RUNNER_TEMP/ottr-zap-roots"
          mkdir -p "$ROOTS/state"
          OMP_TRACKER_ROOTS="$ROOTS" OTTR_STATE_DIR="$ROOTS/state" \
            OMP_TRACKER_PUBLIC_HOSTS="$PUBLIC_HOST" PORT="$PORT" \
            bun src/server.ts >"$RUNNER_TEMP/board.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/board.pid"
          curl -sf --retry 30 --retry-delay 2 --retry-connrefused \
            "http://127.0.0.1:$PORT/api/boot" || { cat "$RUNNER_TEMP/board.log"; exit 1; }
      - name: Stage the rules dir (the zap user writes zap.yaml into /zap/wrk)
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          cp .zap/rules.tsv "$RUNNER_TEMP/zap/"
          chmod -R a+rwX "$RUNNER_TEMP/zap"
      - name: Baseline scan over loopback (no auth wall)
        # zap-baseline.py reads -c rules.tsv from the mounted /zap/wrk; -I keeps the
        # warnings non-failing for the first runs.
        run: |-
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "http://127.0.0.1:$PORT/" -c rules.tsv -I
      - name: Baseline scan as a public host (API walled, Secure cookie flag set)
        run: |-
          docker run --rm --network host --add-host "${PUBLIC_HOST%%:*}:127.0.0.1" \
            -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "http://$PUBLIC_HOST/" -c rules.tsv -I
      - name: Stop the board
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/board.pid")"
