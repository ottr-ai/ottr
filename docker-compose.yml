# ottr compose topology (D5): one host, the board (service server) + disposable workers.
#
# `docker compose up -d --build` builds ottr-worker:local and starts the server
# plus worker-a/worker-b. Provider keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...)
# must exist in the host shell — they are passed through, never baked.
# Worker containers are NEVER port-mapped to the host (D3/D5); only the board's
# UI port is exposed, on loopback.
name: ottr

x-worker: &worker
  image: ottr-worker:local
  command: bun /app/src/worker.ts
  restart: always
  # tini as PID 1 reaps the orphans that omp and test runs leave behind: with bun as
  # PID 1, worker-a held 5,434 zombies after 7 hours (2026-10-12).
  init: true
  # Stateless per D3: task data (DB, sessions, logs, images) lives on the ottr-data
  # volume, clones and worktrees on workspace. Both mount at the server's paths, so
  # the absolute paths in a run request resolve the same. A dead worker is replaced
  # by starting a new one (D5).
  volumes:
    - workspace:/workspace
    - ottr-data:/data
    # Agent layer (rules, config, skills, plugins): alate provisions it here. Shared with
    # the board's home, so it is worker-plantable by design; the board pins its git/gh
    # config and its own omp agent dir to the container filesystem instead (R5-1, see
    # the ottr service env).
    - home:/root
    # Credentials stay on the host (D1); the named home volume holds writable
    # state and the oauth dir is mounted read-only over it.
    - ${OTTR_OAUTH_DIR:?set OTTR_OAUTH_DIR to the host omp oauth dir}:/root/.omp/oauth:ro
    # omp keeps provider auth in agent.db: one file for the stack, seeded once from the host
    # db (VACUUM INTO) and never baked (D1); the stack then logs in by itself (docs/WORKERS.md).
    - ${OTTR_AGENT_DB:?set OTTR_AGENT_DB to a snapshot file of the host omp agent.db}:/root/.omp/agent/agent.db
  environment:
    # Server-to-worker auth, required and random: turns share this network, so a known
    # value would let them drive any worker (workers strip it from every turn's env).
    OTTR_WORKER_TOKEN: ${OTTR_WORKER_TOKEN:?set OTTR_WORKER_TOKEN to a random secret}
    # Fleet memory backend (D8): workers run omp with memory.backend: hindsight
    # against the SHARED Hindsight server (2026-10-08 — replaced the embedded
    # hindsight service; one instance serves local spawns + ottr + future NAS
    # port). The URL comes from the environment: set HINDSIGHT_API_URL in the
    # compose env file (or the host shell) to the Hindsight server address, or
    # save it under Settings -> Hindsight (a saved URL beats this env seed at
    # the next boot, and the board switches this shared config.yml's backend
    # itself). The
    # entry script switches the backend when HINDSIGHT_API_URL is non-empty, so
    # an empty value keeps omp's mnemopi default (no fleet memory, no crash).
    # The tenant API key is set under Settings -> Hindsight: the board
    # hands it to every turn as HINDSIGHT_API_TOKEN. An env file value only
    # seeds it (and serves omp run by hand in a container).
    HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-}
    HINDSIGHT_API_TOKEN:
    # GitHub token for worker-side git and gh (clone, fetch, push, release
    # checks). Passes through from the host shell or the compose env file; the
    # host already holds it in the gh keyring, so export GH_TOKEN there before
    # `docker compose up`. Never baked into the image.
    GH_TOKEN: ${GH_TOKEN:-}
    # Keys that a project's MCP servers read pass through from the host env, like
    # provider keys (mystic-realms' pixellab server, see its .omp/mcp.json).
    PIXELLAB_API_KEY:

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ottr-worker:local
    command: bun /app/src/server.ts
    init: true # reaps orphans as on the workers (148 zombies here after 7 hours, 2026-10-12)
    networks:
      default:
        aliases: [ottr] # turns file cards at http://ottr:<port> (OTTR_BOARD_URL below)
    # Stable identity for the instance lock (src/dblock.ts): its rows carry this hostname (the
    # running stack's, 2026-10-12), and a recreate under another one refuses to boot. Rows an
    # earlier container left behind are taken over (their holder booted before this init).
    # ponytail: a `docker compose run server` one-off gets the same identity and could take
    # the lock; acceptable for this stack shape.
    hostname: ottr-server
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        # Quoted: the plain scalar's " : " made YAML read this item as a mapping.
        - "process.exit((await fetch('http://127.0.0.1:' + process.env.PORT + '/api/boot')).ok ? 0 : 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      # Same port on both sides: the host guard and Origin allowlist accept the app's own
      # port. The connection arrives from the Docker gateway, not loopback, so the board asks
      # for the admin login. Loopback only: the guards read the Host header, which any LAN
      # client can fake.
      - "127.0.0.1:${OTTR_PORT:-8080}:${OTTR_PORT:-8080}"
      # Sign-in callbacks (Settings -> Provider sign-in): the provider sends the browser to
      # localhost:<port>, which on this machine reaches the board; it hands the address to the
      # waiting `omp login`. Anthropic, then OpenAI Codex. Codex's port is fixed, so while the
      # stack runs, `omp login openai-codex` on the host cannot bind it.
      - "127.0.0.1:54545:${OTTR_PORT:-8080}"
      - "127.0.0.1:1455:${OTTR_PORT:-8080}"
    restart: unless-stopped
    volumes:
      - workspace:/workspace
      - ottr-data:/data # per-project task data (OTTR_DATA_DIR), shared with the workers
      - home:/root
      - ottr-state:/app/.tasks # GlobalStore SQLite: board-global kv survives rebuilds
      # Same read-only credential mount as the workers (D1).
      - ${OTTR_OAUTH_DIR:?set OTTR_OAUTH_DIR to the host omp oauth dir}:/root/.omp/oauth:ro
      - ${OTTR_AGENT_DB:?set OTTR_AGENT_DB to a snapshot file of the host omp agent.db}:/root/.omp/agent/agent.db
    environment:
      OMP_TRACKER_HOST: 0.0.0.0 # default is loopback, which dead-ports through the mapping
      OMP_TRACKER_ROOTS: /workspace
      OTTR_DATA_DIR: /data # task data outside the clones: /data/<project>
      # Server-only ssh keys and known_hosts (docs/specs/git-hosts.md): on the ottr-state
      # volume, which no worker mounts. /data and /root are worker-mounted, so never there.
      OTTR_SSH_DIR: /app/.tasks/ssh
      OTTR_WORKER_URLS: http://worker-a:8787,http://worker-b:8787
      OTTR_WORKER_TOKEN: ${OTTR_WORKER_TOKEN:?set OTTR_WORKER_TOKEN to a random secret}
      PORT: ${OTTR_PORT:-8080}
      # Where turns file cards (create_task). Loopback in a worker is the worker itself; the
      # board opens this host to card filing only, with the token it gives each turn.
      OTTR_BOARD_URL: http://ottr:${OTTR_PORT:-8080}
      # R5-1 config boundary: workers mount home:/root and workspace:/workspace read-write,
      # so a turn can plant /root/.gitconfig, /root/.config/gh or a main checkout's
      # .git/config for the board's own git and gh to execute (helper theft, insteadOf
      # redirects, ext:: remotes). The board reads its global git config and its gh config
      # only from the container filesystem, which no worker mounts: the entry script seeds
      # the git config from the provisioned home at every start, gh starts empty on
      # purpose (gh config can name commands). The main checkout's .git/config stays
      # worker-writable by construction of linked worktrees — residual, docs/WORKERS.md.
      GIT_CONFIG_GLOBAL: /etc/ottr/gitconfig
      GH_CONFIG_DIR: /etc/ottr/gh
      # R5-1 omp layer: the board's own omp agent dir (config.yml, agent.db, skills,
      # extensions, plugins, sessions) lives on the container filesystem, which no worker
      # mounts, so a turn cannot plant config or code the board's privileged turns
      # (merge, release review, release) would read or execute. The entry script seeds it
      # from the provisioned home at every start; Settings sign-in writes the pinned
      # credential store and copies the provider's rows through to the shared worker
      # store (src/login.ts shareProviderCredentials).
      PI_CODING_AGENT_DIR: /etc/ottr/omp-agent
      # One shared home volume carries one agent config: with the entry script's
      # backend switch, the whole compose topology runs memory.backend: hindsight
      # (D8) — server-side merge turns included. Mnemopi stays the default for
      # direct spawns outside compose.
      HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-}
      HINDSIGHT_API_TOKEN: # seed only: Settings -> Hindsight (server URL and key) replaces it, as in x-worker
      # Provider keys pass through from the host env. Extend this list for
      # other providers (e.g. OPENROUTER_API_KEY, ZAI_API_KEY).
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      PIXELLAB_API_KEY: # a project MCP server's key, as in x-worker

  worker-a:
    <<: *worker
    build:
      context: .
      dockerfile: Dockerfile.worker

  worker-b:
    <<: *worker
    # Copy-paste this block for worker-c..h and add each to OTTR_WORKER_URLS.
    # Do NOT use `compose --scale`: round-robin DNS breaks cancel routing —
    # per-run addressability requires stable per-worker names.

  # Embedded hindsight service REMOVED 2026-10-08: memory now lives in the
  # shared Hindsight server named by HINDSIGHT_API_URL (tenant-key auth) — one
  # instance serves local spawns, ottr, and the future NAS ottr port. The old
  # hindsight-data volume can be dropped once no longer needed.

volumes:
  workspace:
  home:
  ottr-state:
  ottr-data:
