# ottr compose topology: one host, the board (service server) + disposable workers.
#
# `docker compose up -d --build` builds ottr-worker:local (or OTTR_IMAGE) and starts the server
# plus worker-a/worker-b. Provider keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, ...)
# must exist in the host shell — they are passed through, never baked.
# Worker containers are NEVER port-mapped to the host; only the board's
# UI port is exposed, on loopback.
name: ottr

# json-file never rotates; `local` rotates and compresses. 3 x 10m caps each container at 30 MB.
# Podman has no `local` driver: set OTTR_LOG_DRIVER=k8s-file there (README, Podman).
x-logging: &logging
  driver: ${OTTR_LOG_DRIVER:-local}
  options: { max-size: "10m", max-file: "3" }

x-worker: &worker
  image: ${OTTR_IMAGE:-ottr-worker:local}
  command: bun /app/src/worker.ts
  restart: always
  # tini as PID 1 reaps the orphans that omp and test runs leave behind: with bun as
  # PID 1, worker-a held 5,434 zombies after 7 hours.
  init: true
  # `up -d --wait <worker>` (the rolling update) waits for this: the worker answers its
  # own GET /healthz, so a recreated worker counts as done only when it is connected.
  healthcheck: &worker-healthcheck
    test:
      - CMD
      - bun
      - -e
      # Quoted: the plain scalar's " : " made YAML read this item as a mapping.
      - "process.exit((await fetch('http://127.0.0.1:' + (process.env.WORKER_PORT || 8787) + '/healthz')).ok ? 0 : 1)"
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 30s
  logging: *logging
  # ponytail: estimate (Chrome + bun test + agent turns), not a measured peak. Run
  # `docker stats` under load and set about 2x the peak in the compose env file.
  mem_limit: ${OTTR_WORKER_MEM_LIMIT:-8g}
  # Stateless: task data for workers (sessions, logs, images) lives on the ottr-data
  # volume, clones and worktrees on workspace. Both mount at the server's paths, so
  # the absolute paths in a run request resolve the same. A dead worker is replaced
  # by starting a new one.
  volumes:
    - workspace:/workspace
    - ottr-data:/data
    # Agent layer (rules, config, skills, plugins): alate provisions it here as layers
    # under /root/.alate/layers/<id> and switches /root/.alate/current with one atomic
    # rename (docs/specs/agent-layer-switch.md). A turn pins the layer it started with:
    # its HOME and agent dir resolve once at spawn and stay there for the run's life.
    # Shared state (agent.db, oauth, logs, caches, git/gh config) stays at its flat path
    # and is linked into each layer. The home is shared with the board's home, so it is
    # worker-plantable by design; the board pins its git/gh config and its own omp agent
    # dir to the server-only board-config volume instead (R5-1, see the server service
    # env) and never copies from this home.
    - home:/root
    # Credentials stay on the host; the named home volume holds writable
    # state and the oauth dir is mounted read-only over it.
    - ${OTTR_OAUTH_DIR:?set OTTR_OAUTH_DIR to the host omp oauth dir}:/root/.omp/oauth:ro
    # omp keeps provider auth in agent.db: one file for the stack, seeded once from the host
    # db (VACUUM INTO) and never baked; the stack then logs in by itself (docs/WORKERS.md).
    - ${OTTR_AGENT_DB:?set OTTR_AGENT_DB to a snapshot file of the host omp agent.db}:/root/.omp/agent/agent.db
    # BuildKit sidecar (the `build` profile below, OTTR-785): the client certificate
    # and CA only, read-only. Never the daemon key (buildkit-daemon-certs) or the CA
    # key, which lives only inside the buildkit-certs one-off and dies with it. The
    # volumes stay empty until the profile runs; a turn without the profile then has
    # no client certificate, and buildctl is absent from the turn env.
    - buildkit-client-certs:/certs/buildkit/client:ro
    - buildkit-ca:/certs/buildkit/ca:ro
  environment:
    # Server-to-worker auth, required and random: turns share this network, so a known
    # value would let them drive any worker (workers strip it from every turn's env).
    OTTR_WORKER_TOKEN: ${OTTR_WORKER_TOKEN:?set OTTR_WORKER_TOKEN to a random secret}
    # Fleet memory: the board derives the backend from this env at every omp
    # spawn and passes a --config overlay (/data/omp-memory.yml). A non-empty
    # HINDSIGHT_API_URL picks hindsight against the shared Hindsight server
    # (set it in the compose env file or the host shell); an empty value keeps
    # omp's mnemopi default. A URL saved under Settings -> Hindsight beats this
    # env seed at the next boot. The tenant API key is set under Settings ->
    # Hindsight: the key still travels as HINDSIGHT_API_TOKEN, so the board can
    # save it. An env file value only seeds it (and serves omp run by hand in a
    # container).
    HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-}
    HINDSIGHT_API_TOKEN: # seed only: Settings -> Hindsight (server URL and key) replaces it, as in x-worker
    # No GitHub token here: workers run turns only, and push credentials stay on the
    # server (D6). The worker daemon strips GH_TOKEN and every git host credential from
    # each turn's env, so a token set here would never reach a turn.
    # Project tools and env names come from the data repo instead
    # (workers/<project>/tools.json and env.txt, docs/WORKERS.md).
    # BuildKit sidecar (the `build` profile): empty keeps every turn without image
    # builds. The compose env file sets all four together with COMPOSE_PROFILES=build
    # (the OTTR_VM_RUNNER_URL pattern). buildctl reads the address from BUILDKIT_HOST;
    # the TLS paths have no env form, so turns pass the BUILDKIT_TLS_* values as flags:
    #   buildctl --tlscacert "$BUILDKIT_TLS_CA" --tlscert "$BUILDKIT_TLS_CERT" \
    #     --tlskey "$BUILDKIT_TLS_KEY" build ...
    # (docs/WORKERS.md "Image builds in turns", spec docs/specs/turn-image-builds.md).
    BUILDKIT_HOST: ${BUILDKIT_HOST:-}
    BUILDKIT_TLS_CA: ${BUILDKIT_TLS_CA:-}
    BUILDKIT_TLS_CERT: ${BUILDKIT_TLS_CERT:-}
    BUILDKIT_TLS_KEY: ${BUILDKIT_TLS_KEY:-}
  # Every worker joins the buildkit network, so a build turn reaches the daemon over
  # mTLS. The server never joins it: no route from the board's container (acceptance).
  networks:
    - default
    - buildkit

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        OTTR_VERSION: ${OTTR_VERSION:-}
    image: ${OTTR_IMAGE:-ottr-worker:local}
    command: bun /app/src/server.ts
    init: true # reaps orphans as on the workers (148 zombies here after 7 hours, 2026-10-12)
    logging: *logging
    # Estimate: the board runs merge, release, and retro turns itself (bun test included).
    mem_limit: ${OTTR_SERVER_MEM_LIMIT:-8g}
    networks:
      default:
        aliases: [ottr] # turns file cards at http://ottr:<port> (OTTR_BOARD_URL below)
    # Stable identity for the instance lock (src/dblock.ts): its rows carry this hostname (the
    # running stack's, 2026-10-12), and a recreate under another one refuses to boot. Rows an
    # earlier container left behind are taken over (their holder booted before this init).
    # ponytail: a `docker compose run server` one-off gets the same identity and could take
    # the lock; acceptable for this stack shape.
    hostname: ottr-server
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        # Quoted: the plain scalar's " : " made YAML read this item as a mapping.
        - "process.exit((await fetch('http://127.0.0.1:' + process.env.PORT + '/api/boot')).ok ? 0 : 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      # Same port on both sides: the host guard and Origin allowlist accept the app's own
      # port. The connection arrives from the Docker gateway, not loopback, so the board asks
      # for the admin login. Loopback only: the guards read the Host header, which any LAN
      # client can fake.
      - "127.0.0.1:${OTTR_PORT:-8080}:${OTTR_PORT:-8080}"
      # Sign-in callbacks (Settings -> Provider sign-in): the provider sends the browser to
      # localhost:<port>, which on this machine reaches the board; it hands the address to the
      # waiting `omp login`. Anthropic, then OpenAI Codex. Codex's port is fixed, so while the
      # stack runs, `omp login openai-codex` on the host cannot bind it.
      - "127.0.0.1:54545:${OTTR_PORT:-8080}"
      - "127.0.0.1:1455:${OTTR_PORT:-8080}"
      # Settings -> omp usage -> Launch omp stats dashboard: the board-guarded proxy to
      # `omp stats`. Same port on both sides for its host guard. Like the board port, it
      # asks for the admin login. Keep a real port number here: to disable the proxy, set
      # the server's OTTR_OMP_STATS_PORT below to off and delete this line.
      - "127.0.0.1:${OTTR_OMP_STATS_PORT:-3848}:${OTTR_OMP_STATS_PORT:-3848}"
    restart: unless-stopped
    volumes:
      - workspace:/workspace
      - ottr-data:/data # per-project task data for workers (OTTR_DATA_DIR): sessions, logs, images, handoffs
      - home:/root
      # R5-1: the board's pinned git/gh config and omp agent dir. Server-only: workers never
      # mount it. Survives recreates. Only the trusted board-seed one-off fills the agent dir.
      - board-config:/etc/ottr
      - ottr-state:/app/.tasks # GlobalStore SQLite and the per-project tasks.db files. No worker mounts it.
      # Daily snapshots of tracker.db and each tasks.db (docs/specs/db-backup.md). Server-only
      # as ottr-state: a snapshot holds the same tokens. Set OTTR_BACKUP_MOUNT in the env file
      # to a host path on another disk.
      - ${OTTR_BACKUP_MOUNT:-ottr-backup}:/backup
      # Same read-only credential mount as the workers.
      - ${OTTR_OAUTH_DIR:?set OTTR_OAUTH_DIR to the host omp oauth dir}:/root/.omp/oauth:ro
      - ${OTTR_AGENT_DB:?set OTTR_AGENT_DB to a snapshot file of the host omp agent.db}:/root/.omp/agent/agent.db
    environment:
      OMP_TRACKER_HOST: 0.0.0.0 # default is loopback, which dead-ports through the mapping
      OMP_TRACKER_ROOTS: /workspace
      OTTR_DATA_DIR: /data # task data outside the clones: /data/<project>
      # Server-only project state (tasks.db with settings and task rows, fork caches) on the
      # ottr-state volume, which no worker mounts. /data keeps only what workers need.
      OTTR_SERVER_DATA_DIR: /app/.tasks/projects
      # Server-only ssh keys and known_hosts : on the ottr-state
      # volume, which no worker mounts. /data and /root are worker-mounted, so never there.
      OTTR_SSH_DIR: /app/.tasks/ssh
      OTTR_BACKUP_DIR: /backup
      OTTR_BACKUP_KEEP: ${OTTR_BACKUP_KEEP:-7} # snapshots to keep; 0 turns the backups off
      OTTR_WORKER_URLS: http://worker-a:8787,http://worker-b:8787
      # The microVM runner (the `vm` profile below): empty keeps every turn on the classic
      # workers, and the board holds the work turns of a project with microVMs on (the
      # card waits) instead of running them in a shared container. Set it to
      # http://vm-runner:8787 when the profile runs (COMPOSE_PROFILES=vm in the env file).
      OTTR_VM_RUNNER_URL: ${OTTR_VM_RUNNER_URL:-}
      OTTR_WORKER_TOKEN: ${OTTR_WORKER_TOKEN:?set OTTR_WORKER_TOKEN to a random secret}
      PORT: ${OTTR_PORT:-8080}
      # The omp stats dashboard proxy port (docs/specs/omp-stats-dashboard.md); 0/off disables.
      # Recreate the stack once after a change, so Docker publishes the new port.
      OTTR_OMP_STATS_PORT: ${OTTR_OMP_STATS_PORT:-3848}
      # Where turns file cards (create_task). Loopback in a worker is the worker itself; the
      # board opens this host to card filing only, with the token it gives each turn.
      OTTR_BOARD_URL: http://ottr:${OTTR_PORT:-8080}
      # GitHub host pass-through (src/githubHost.ts): the board reads OTTR_GITHUB_HOST;
      # empty keeps the default github.com. README "GitHub host" has the values.
      OTTR_GITHUB_HOST: ${OTTR_GITHUB_HOST:-}
      # Boot-report pass-through (docker/ottr-entry.sh logs them once, before its
      # refusal checks): a stale OTTR_IMAGE or old host path left in the shell beats
      # .env and silently keeps the previous release (README, Podman); the boot line
      # shows the live values even when the entry refuses to start. Dedicated names:
      # OTTR_OAUTH_DIR/OTTR_AGENT_DB must stay OUT of the container env, because the
      # entry script's refusal checks fall back to the container-side fixed paths and
      # a host path string in the env would fail them on every start.
      OTTR_PINNED_IMAGE: ${OTTR_IMAGE:-}
      OTTR_PINNED_OAUTH_DIR: ${OTTR_OAUTH_DIR:-}
      OTTR_PINNED_AGENT_DB: ${OTTR_AGENT_DB:-}
      # R5-1 config boundary: workers mount home:/root and workspace:/workspace read-write,
      # so a turn can plant /root/.gitconfig, /root/.config/gh or a main checkout's
      # .git/config for the board's own git and gh to execute (helper theft, insteadOf
      # redirects, ext:: remotes). The board reads its global git config and its gh config
      # only from the board-config volume, which no worker mounts. The entry script never
      # copies from the shared home: an absent git config starts with the fixed Ottr
      # identity only, gh starts empty on purpose (gh config can name commands). The main
      # checkout's .git/config stays worker-writable by construction of linked worktrees —
      # residual, docs/WORKERS.md.
      GIT_CONFIG_GLOBAL: /etc/ottr/gitconfig
      GH_CONFIG_DIR: /etc/ottr/gh
      # R5-1 omp layer: the board's own omp agent dir (config.yml, agent.db, skills,
      # extensions, sessions) lives on the board-config volume, which no worker mounts, so
      # a turn cannot plant config or code the board's privileged turns (merge, release
      # review, release) would read or execute. The entry script never copies it from the
      # shared home: it starts empty and the entry script logs that it is unseeded while
      # no layer seeds the board home either. The board-seed one-off fills the board home
      # from the data repo; the board's own turns pin the current board-home layer at
      # spawn, and HOME and this variable then point into the layer dir for that run
      # (docs/specs/agent-layer-switch.md). This flat path stays the no-layer fallback and
      # the location of the credential store, which every layer links. Settings sign-in
      # runs one omp login for this store and a second one for the shared worker store, so
      # each store keeps its own refresh token (docs/specs/provider-credentials.md).
      PI_CODING_AGENT_DIR: /etc/ottr/home/.omp/agent
      # R5-1: omp reads its plugins ($HOME/.omp/plugins) and the user skills and context
      # files (~/.agents, ~/.claude, ...) from HOME, never from PI_CODING_AGENT_DIR, and HOME
      # here is the worker-writable shared home. The board's own omp spawns (merge, release
      # review, release, models, usage, sign-in) run with this server-only HOME instead,
      # the one board-seed installs into: board-seed installs the agent layer here under
      # .alate/layers/<id> and switches .alate/current with one atomic rename, and the
      # board's spawns pin the layer the link names at spawn. The flat copy of the layer
      # remains only as the no-layer fallback. The board's own reads of the shared home
      # (apt lists, shared store) keep /root.
      OTTR_BOARD_OMP_HOME: /etc/ottr/home
      # One shared home volume carries one agent config. The server writes the
      # memory overlay to OTTR_DATA_DIR=/data ($OTTR_DATA_DIR/omp-memory.yml);
      # the workers resolve the same path, and the board passes it as --config
      # at every spawn — server-side runs included.
      # memory.backend is not agent-layer content (OTTR-453): the pin never
      # rewrites a layer's config.yml.
      HINDSIGHT_API_URL: ${HINDSIGHT_API_URL:-}
      HINDSIGHT_API_TOKEN: # seed only: Settings -> Hindsight (server URL and key) replaces it, as in x-worker
      # Alate pairing (the `alate` profile below): these seed Settings -> Alate while it
      # holds no URL or key, and a value saved there wins at the next boot. With the
      # profile on, http://alate:4570 is the bundled service; the key never reaches a log.
      ALATE_URL: ${ALATE_URL:-}
      ALATE_API_KEY: ${ALATE_API_KEY:-}
      # Provider keys pass through from the host env. Extend this list for
      # other providers (e.g. OPENROUTER_API_KEY, ZAI_API_KEY).
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:

  worker-a:
    <<: *worker
    build:
      context: .
      dockerfile: Dockerfile.worker

  worker-b:
    <<: *worker
    # Copy-paste this block for worker-c..h and add each to OTTR_WORKER_URLS.
    # Do NOT use `compose --scale`: round-robin DNS breaks cancel routing —
    # per-run addressability requires stable per-worker names.

  # Rootless BuildKit sidecar (OTTR-785, spec docs/specs/turn-image-builds.md): lets a
  # work turn build container images (Dockerfile.worker, project Dockerfiles) with no
  # host docker access, no host socket and no privileged mode. Off unless the env file
  # sets COMPOSE_PROFILES=build together with the BUILDKIT_* values the x-worker anchor
  # passes through. The daemon holds no credentials, publishes no port, and answers
  # only workers that present the client certificate (mTLS). Podman has no
  # systempaths=unconfined, so the profile is Docker-only (README, Podman).
  buildkit:
    # Digest-pinned 2026-11-10 (multiarch index). The image runs as uid 1000; its
    # rootlesskit entrypoint sets up the user namespace, so build steps never run as
    # real root on the host.
    image: moby/buildkit:v0.34.2-rootless@sha256:c8252268760e1baba80780d63d738ef9f260fb7c7c0973c78494cb9ddd99eda1
    profiles: [build]
    restart: unless-stopped
    logging: *logging
    # One build cannot starve turns: build steps run inside this cgroup.
    mem_limit: ${OTTR_BUILDKIT_MEM_LIMIT:-8g}
    cpus: "${OTTR_BUILDKIT_CPUS:-4}"
    depends_on:
      buildkit-certs:
        condition: service_completed_successfully
    # The BuildKit rootless docs' container mode (moby/buildkit docs/rootless.md):
    # runc inside the daemon's user namespace needs unshare and mount (seccomp,
    # apparmor), and each build step needs its own /proc (systempaths). The alternative
    # the docs name, --oci-worker-no-process-sandbox, is discouraged there: it cannot
    # kill build steps that fail to exit, and it lets a build step kill or ptrace daemon
    # processes. This daemon runs untrusted build steps from agent turns, so the docs'
    # primary mode wins, and the tradeoff lands on a secretless sidecar: uid 1000, no
    # credentials, reachable only from workers over mTLS.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    networks:
      - buildkit
    volumes:
      # The daemon key lives only here; no worker mounts this volume. The gc policy
      # (OTTR_BUILDKIT_CACHE_CAP, default 20 GB) is in buildkit-config.
      - buildkit-config:/config:ro
      - buildkit-ca:/certs/ca:ro
      - buildkit-daemon-certs:/certs/daemon:ro
      - buildkit-state:/home/user/.local/share/buildkit
    command:
      # buildkitd flags (the image entrypoint is `rootlesskit buildkitd`): mTLS on tcp
      # 1234 only, and the cache-cap config the one-off wrote. A partial config is safe:
      # the rootless defaults (state under $HOME) come from the user namespace, not
      # from the file.
      - --config
      - /config/buildkitd.toml
      - --addr
      - tcp://0.0.0.0:1234
      - --tlscacert
      - /certs/ca/ca.pem
      - --tlscert
      - /certs/daemon/cert.pem
      - --tlskey
      - /certs/daemon/key.pem

  # One-shot seed of the BuildKit TLS material (the `build` profile): generates the CA,
  # the daemon (server) cert and the one client cert, plus the cache-cap config, into
  # the named volumes. Idempotent: with all six outputs present it chowns the state
  # volume for the daemon user and exits 0, so `up` can rerun it. The CA key is
  # generated in /tmp and discarded there: it never lands in a volume, so no container
  # can mint more certificates. Rotation: remove the four cert volumes, then
  #   docker compose --profile build up -d --force-recreate buildkit worker-a worker-b
  # (docs/WORKERS.md "Image builds in turns").
  buildkit-certs:
    image: ${OTTR_IMAGE:-ottr-worker:local}
    profiles: [build]
    restart: "no"
    logging: *logging
    mem_limit: ${OTTR_BUILDKIT_CERTS_MEM_LIMIT:-1g}
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        openssl version
        if [ -f /certs/ca/ca.pem ] && [ -f /certs/daemon/cert.pem ] && \
           [ -f /certs/daemon/key.pem ] && [ -f /certs/client/cert.pem ] && \
           [ -f /certs/client/key.pem ] && [ -f /config/buildkitd.toml ]; then
          chown 1000:1000 /state
          echo "buildkit certs and config exist; keeping them"
          exit 0
        fi
        umask 077
        mkdir -p /certs/ca /certs/daemon /certs/client /config /state
        rm -f /certs/ca/ca.pem /certs/daemon/cert.pem /certs/daemon/key.pem \
          /certs/client/cert.pem /certs/client/key.pem /config/buildkitd.toml
        # CA. The key stays in /tmp and dies with the one-off container.
        openssl genrsa -out /tmp/ca.key 4096
        openssl req -x509 -new -sha256 -days 3650 -key /tmp/ca.key \
          -subj /CN=ottr-buildkit-ca -out /certs/ca/ca.pem
        # Daemon (server) cert: the compose DNS name is the SAN, so the workers'
        # buildctl verifies the daemon it reached as "buildkit".
        openssl genrsa -out /tmp/daemon.key 4096
        openssl req -new -sha256 -key /tmp/daemon.key -subj /CN=buildkit -out /tmp/daemon.csr
        printf 'basicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=DNS:buildkit,IP:127.0.0.1\n' > /tmp/daemon.ext
        openssl x509 -req -sha256 -days 3650 -in /tmp/daemon.csr \
          -CA /certs/ca/ca.pem -CAkey /tmp/ca.key -CAcreateserial \
          -extfile /tmp/daemon.ext -out /certs/daemon/cert.pem
        install -o 1000 -g 1000 -m 0400 /tmp/daemon.key /certs/daemon/key.pem
        # Client cert: the one certificate a turn can hold. Workers run as root.
        openssl genrsa -out /tmp/client.key 4096
        openssl req -new -sha256 -key /tmp/client.key -subj /CN=ottr-buildctl -out /tmp/client.csr
        printf 'basicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\nextendedKeyUsage=clientAuth\n' > /tmp/client.ext
        openssl x509 -req -sha256 -days 3650 -in /tmp/client.csr \
          -CA /certs/ca/ca.pem -CAkey /tmp/ca.key -CAcreateserial \
          -extfile /tmp/client.ext -out /certs/client/cert.pem
        install -m 0400 /tmp/client.key /certs/client/key.pem
        chmod 0444 /certs/ca/ca.pem /certs/daemon/cert.pem /certs/client/cert.pem
        openssl verify -CAfile /certs/ca/ca.pem /certs/daemon/cert.pem /certs/client/cert.pem
        # One fleet-wide gc policy keeps the cache under the cap (default 20 GB).
        # gcpolicy is an ARRAY of tables in buildkitd's config (upstream
        # docs/buildkitd.toml.md): a single table is not the documented shape.
        cat > /config/buildkitd.toml <<EOF
        # Generated by buildkit-certs. Do not edit in place: rotate the cert volumes
        # and rerun the one-off (docs/WORKERS.md "Image builds in turns").
        [worker.oci]
          gc = true
          [[worker.oci.gcpolicy]]
            reservedSpace = "4GB"
            maxUsedSpace = "${OTTR_BUILDKIT_CACHE_CAP:-20GB}"
            minFreeSpace = "5GB"
            keepDuration = 172800
        EOF
        # The daemon runs as uid 1000: the config must be world-readable, or
        # buildkitd exits with "failed to load config from /config/buildkitd.toml".
        chmod 0444 /config/buildkitd.toml
        chown 1000:1000 /state
        rm -f /tmp/ca.key /tmp/daemon.key /tmp/client.key /tmp/daemon.csr \
          /tmp/client.csr /tmp/daemon.ext /tmp/client.ext
        echo "buildkit certs and config written"
    volumes:
      - buildkit-ca:/certs/ca
      - buildkit-daemon-certs:/certs/daemon
      - buildkit-client-certs:/certs/client
      - buildkit-config:/config
      - buildkit-state:/state

  # The microVM runner (OTTR-532): runs every work turn of a project with microVMs on
  # (Settings) in its own Firecracker microVM, so a turn sees its own clone and nothing of
  # the other projects, the shared home or the credentials. It speaks the worker protocol
  # to the board at http://vm-runner:8787 (server env OTTR_VM_RUNNER_URL). Off unless the
  # env file sets COMPOSE_PROFILES=vm (also what scripts/update-image.ts needs to build and
  # roll it); the host needs /dev/kvm (bare metal, a KVM VM with nested virtualisation, or
  # WSL2 with nestedVirtualization). Its image is the worker image plus Firecracker and the
  # guest kernel (Dockerfile.worker, target vm-runner), and the guests boot from its root.
  vm-runner:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: vm-runner
      args:
        OTTR_VERSION: ${OTTR_VERSION:-}
    image: ${OTTR_VM_IMAGE:-ottr-vm-runner:local}
    profiles: [vm]
    restart: always
    init: true # reaps the firecracker processes and the image tools it runs, as on the workers
    logging: *logging
    healthcheck: *worker-healthcheck
    # Guest memory is firecracker's own memory, counted in this container: the limit must
    # cover OTTR_VM_MAX x OTTR_VM_MEM (2 x 8g by default) plus the runner and its disk
    # builds, or the kernel kills a VM mid-turn. Raise it with either value.
    mem_limit: ${OTTR_VM_RUNNER_MEM_LIMIT:-20g}
    # The only privileges it gets, no `privileged`:
    devices:
      - /dev/kvm # firecracker runs each guest on KVM
      - /dev/net/tun # one tap device per VM, its only network link
    cap_add:
      # Creates the taps and their addresses, and the iptables rules that let a VM reach
      # the board and the internet but no other compose service, VM or this runner's API.
      - NET_ADMIN
    sysctls:
      # Routes VM traffic out through this container. A per-container (netns) setting:
      # the host's own forwarding stays as it is. /proc/sys is read-only in here.
      net.ipv4.ip_forward: "1"
    # No workspace, no credential mounts: a VM clones its branch from the board's git
    # endpoint and reaches providers through the board's /llm proxy.
    volumes:
      - ottr-data:/data # copies a turn's task data in and its new files back out
      - home:/root:ro # project package and tool lists, the pinned agent layer (read only)
      - vm-state:/var/lib/ottr-vm # base rootfs, project layers, scratch disks: large
    environment:
      # The same server-to-worker auth as the workers (x-otwr-token on every call).
      OTTR_WORKER_TOKEN: ${OTTR_WORKER_TOKEN:?set OTTR_WORKER_TOKEN to a random secret}
      # VMs at once; one more /run answers 503 busy, and the card waits for a free slot.
      OTTR_VM_MAX: ${OTTR_VM_MAX:-2}
      OTTR_VM_VCPUS: ${OTTR_VM_VCPUS:-2}
      OTTR_VM_MEM: ${OTTR_VM_MEM:-8g} # per VM: 8g, 8192m or bytes
      OTTR_VM_DISK: ${OTTR_VM_DISK:-20g} # per VM scratch disk (sparse)
      # The board's compose name: the VM's /etc/hosts maps it to the board's address, so
      # OTTR_BOARD_URL (http://ottr:<port>) works unchanged inside the VM.
      OTTR_VM_BOARD_HOST: ottr

  # R5-1 trusted seed of the board-config volume: a one-off of the Alate image. It restores
  # the user layer from the data repo with the same SkillSpector scan as worker provisioning
  # (fail-closed), then installs the rules. It installs into /etc/ottr/home/.alate/layers/<id>
  # and switches /etc/ottr/home/.alate/current with one atomic rename, and keeps writing
  # /etc/ottr/seed-commit next to the home (the paired alate change is ALAT-63). Safe while
  # turns run: they keep the layer they pinned at spawn, and new turns pin the new layer, so
  # a seed needs no restart. The profile keeps `docker compose up` from starting it. Usage:
  #   docker compose run --rm board-seed --repo <owner/name>
  #   docker compose run --rm -v <data-repo>:/data:ro board-seed --data /data
  # then `docker compose restart server` (a restart re-derives the memory
  # backend from the env).
  # --force: the data repo wins over board-local edits. Plugins install into the layer the
  # switch selects: the server's OTTR_BOARD_OMP_HOME tree, the HOME that the board's own
  # omp reads plugins and user skills from.
  board-seed:
    image: ${ALATE_IMAGE:-ghcr.io/ottr-ai/alate:latest}
    profiles: [seed]
    logging: *logging
    mem_limit: ${OTTR_SEED_MEM_LIMIT:-4g} # estimate: git clone, SkillSpector scan, installs
    volumes:
      - board-config:/etc/ottr
    environment:
      GH_TOKEN: ${GH_TOKEN:-} # clones a private data repo
    entrypoint:
      - sh
      - -c
      - node install-user.mjs --home /etc/ottr/home --force "$$@" && node sync.mjs /etc/ottr/home/.omp/agent/rules "$$@"
      - board-seed

  # Repair for the empty agent.db folder: a wrong OTTR_AGENT_DB host path makes rootful
  # Podman create an empty folder, and the home volume keeps it — the bind mount then
  # fails on every recreate with `crun: mount ... agent.db: Not a directory`, because
  # the folder is only reachable from a container that does NOT bind the failing path.
  # This one-off mounts the home volume WITHOUT the agent.db bind and removes the empty
  # folder (only an empty one; a non-empty folder or a real file is refused). The image
  # entrypoint /ottr-entry.sh handles it: first argument repair-agent-db. Usage:
  #   docker compose run --rm home-repair
  home-repair:
    image: ${OTTR_IMAGE:-ottr-worker:local}
    profiles: [repair]
    logging: *logging
    volumes:
      - home:/root
    command: [repair-agent-db]

  # Memory lives in the shared Hindsight server named by HINDSIGHT_API_URL
  # (tenant-key auth); set the URL in the compose env file or in Settings.

  # Alate, the provisioning side of the pair, bundled for the quick start: the profile
  # keeps the service off unless the env sets COMPOSE_PROFILES=alate, so a user whose
  # Alate server already runs keeps today's setup. The board reaches it at
  # http://alate:4570 on the default network; the dashboard is loopback-only on the
  # host. ALATE_URL and ALATE_API_KEY (server env above) seed Settings -> Alate, and a
  # value saved there wins. The key never reaches a log. Alate provisions the agent
  # layer as layers under /root/.alate/layers/<id> and switches /root/.alate/current
  # with one atomic rename; it reads /root/.alate/in-use.json (the board's registry of
  # layers that live runs pinned) before a clean-up, which keeps the current layer, the
  # one before it, and every layer in the registry (docs/specs/agent-layer-switch.md).
  alate:
    image: ${ALATE_IMAGE:-ghcr.io/ottr-ai/alate:latest}
    profiles: [alate]
    # Podman injects the host proxy env (HTTP_PROXY/HTTPS_PROXY/NO_PROXY) into every
    # container; its NO_PROXY names no compose services, so http://alate:4570 and
    # http://ottr:<port> from the board would bounce off the corporate proxy. The image
    # is external and carries no ottr entry script, so bind-mount one and source it.
    entrypoint:
      - sh
      - -c
      - . /no-proxy.sh && exec node server.ts --host 0.0.0.0 --config /state/server-config.json --db /state/alate.db
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./docker/no-proxy.sh:/no-proxy.sh:ro
      - home:/root # alate provisions the workers' shared agent layer here
      - alate-state:/state
    environment:
      # The key alate itself requires on every request.
      ALATE_API_KEY: ${ALATE_API_KEY:-}
      # Layer mode on (docs/specs/agent-layer-switch.md): layers with an atomic switch, not the flat home.
      ALATE_LAYER: "1"
    ports:
      - "127.0.0.1:4570:4570"

# The buildkit network belongs to the `build` profile (services above). Not compose-
# internal on purpose: buildkitd pulls base images from docker.io, and an internal
# network has no egress. Isolation still holds: only the workers join it besides the
# daemon, and Docker isolates bridge networks from each other, so the server (default
# network only) has no route to buildkit.
# `default` is declared only so podman-compose sees it (it raises "missing networks"
# on a service network absent from this block); Docker Compose adds it implicitly.
networks:
  default: {}
  buildkit: {}

volumes:
  workspace:
  home:
  ottr-state:
  ottr-backup:
  ottr-data:
  board-config:
  alate-state:
  vm-state:
  # BuildKit TLS material and state (the `build` profile). The CA key is never stored:
  # buildkit-certs signs in /tmp and discards it.
  buildkit-ca:
  buildkit-daemon-certs:
  buildkit-client-certs:
  buildkit-config:
  buildkit-state:
